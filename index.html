    <!-- ===== Initial page background (prevents white flash) ===== -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0f;
        color: #e5e7eb;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Loading splash — removed automatically once React mounts */
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 9999;
        background: radial-gradient(
            circle at 50% 40%,
            rgba(225, 29, 72, 0.18),
            transparent 60%
          ),
          #0a0a0f;
        transition: opacity 0.4s ease;
      }

      #initial-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-logo {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -1.5px;
        background: linear-gradient(135deg, #e11d48, #f43f5e, #fb7185);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: pulse 1.6s ease-in-out infinite;
      }

      .splash-sub {
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #71717a;
        font-weight: 500;
      }

      .splash-bar {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
        position: relative;
      }

      .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #e11d48, #fb7185);
        animation: slide 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.75;
          transform: scale(0.97);
        }
      }

      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      /* Hide splash when JS is disabled or React has taken over */
      .js-loaded #initial-splash {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- ===== SEO fallback content (hidden until JS loads, for crawlers) ===== -->
    <noscript>
      <div
        style="
          padding: 40px;
          max-width: 720px;
          margin: 0 auto;
          font-family: Arial, sans-serif;
          color: #e5e7eb;
        "
      >
        <h1 style="color: #e11d48">readyAPI — CineSubz Scraper Platform</h1>
        <p>
          Blazing-fast CineSubz Movie &amp; TV scraper API with Sinhala
          subtitles. Live system diagnostics, RAM usage, latency metrics, and an
          interactive playground.
        </p>
        <p>
          ⚠️ JavaScript is required to use the interactive playground. Please
          enable JavaScript in your browser.
        </p>
        <h3>Available Endpoints</h3>
        <ul>
          <li><code>GET /api/system/stats</code> — Live system diagnostics</li>
          <li>
            <code>GET /api/v1/movies/cinesubz/search?q=spiderman</code> — Movie
            search
          </li>
          <li>
            <code>GET /api/v1/movies/cinesubz/infodl?q=spiderman</code> — Movie
            info + downloads
          </li>
          <li>
            <code>GET /api/v1/movies/cinesubz/tv/search?q=avatar</code> — TV
            series search
          </li>
          <li>
            <code>GET /api/v1/movies/cinesubz/tv/info?q=avatar</code> — TV
            series info
          </li>
        </ul>
      </div>
    </noscript>

    <!-- ===== Loading splash (visible until React mounts) ===== -->
    <div id="initial-splash">
      <div class="splash-logo">readyAPI</div>
      <div class="splash-sub">Booting Engine</div>
      <div class="splash-bar"></div>
    </div>

    <!-- ===== React Mount Point ===== -->
    <div id="root"></div>

    <!-- ===== App Entry ===== -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- ===== Hide splash once app is ready ===== -->
    <script>
      // Hide splash after a small delay or when React takes over
      const hideSplash = () => {
        const el = document.getElementById('initial-splash');
        if (el) {
          el.classList.add('hidden');
          setTimeout(() => el.remove(), 500);
        }
      };

      // Try after DOMContentLoaded + a short delay
      window.addEventListener('load', () => setTimeout(hideSplash, 900));

      // Safety net: if React root has children, hide immediately
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          hideSplash();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
